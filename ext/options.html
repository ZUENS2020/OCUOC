<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>OCUOC Browser Bridge</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px auto; max-width: 520px;
           color: #111; background: #fafafa; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    button { margin-top: 14px; padding: 6px 16px; font: inherit; cursor: pointer; }
    #status { margin-top: 14px; padding: 8px 10px; border-radius: 6px; background: #eee; }
    code { background: #eee; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>OCUOC Browser Bridge</h2>
  <p>连接本机 OCUOC MCP 进程的 browser-use 桥(仅 127.0.0.1)。地址与令牌由
     OCUOC 工具 <code>browser_bridge_info</code> 输出。</p>
  <label for="endpoint">WebSocket 地址</label>
  <input id="endpoint" placeholder="ws://127.0.0.1:39157" />
  <label for="token">配对令牌</label>
  <input id="token" placeholder="64 位十六进制" />
  <button id="save">保存并连接</button>
  <div id="status">未连接</div>
  <script src="options.js"></script>
</body>
</html>
